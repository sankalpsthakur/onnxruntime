# Fork-only validation for the FusedMatMul zero-dim fix. Never part of an upstream PR.
name: fork-validate-33244

on:
  push:
    branches: ['validate/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # microsoft/onnxruntime main the fix commit was made on (HEAD~2 on this branch).
  BASE_SHA: 973f680e7042057bb88245347dc52ce4e19f8f40

jobs:
  wheel-repro:
    name: released wheel repro (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install released packages
        run: python -m pip install onnx onnxruntime numpy
      - name: Write the repro from the issue
        run: |
          cat > repro.py <<'PY'
          import sys
          import numpy as np
          import onnx
          import onnxruntime as ort
          from onnx import helper as h, TensorProto as T
          from onnx.reference import ReferenceEvaluator

          def vi(name, shape):
              return h.make_tensor_value_info(name, T.FLOAT, shape)

          nodes = [
              h.make_node("Transpose", ["A"], ["At"], perm=[1, 2, 0]),
              h.make_node("Transpose", ["B"], ["Bt"], perm=[0, 2, 1]),
              h.make_node("MatMul", ["At", "Bt"], ["Y"]),
          ]
          m = h.make_model(h.make_graph(nodes, "repro", [vi("A", [0, 3, 2]), vi("B", [3, 2, 0])],
                                        [vi("Y", [3, 2, 2])]),
                           opset_imports=[h.make_opsetid("", 13)], ir_version=10)
          onnx.checker.check_model(m)
          feeds = {"A": np.empty((0, 3, 2), np.float32), "B": np.empty((3, 2, 0), np.float32)}
          mode = sys.argv[1]
          if mode == "reference":
              y = ReferenceEvaluator(m).run(None, feeds)[0]
          else:
              so = ort.SessionOptions()
              so.graph_optimization_level = {
                  "disable": ort.GraphOptimizationLevel.ORT_DISABLE_ALL,
                  "basic": ort.GraphOptimizationLevel.ORT_ENABLE_BASIC,
                  "extended": ort.GraphOptimizationLevel.ORT_ENABLE_EXTENDED,
                  "all": ort.GraphOptimizationLevel.ORT_ENABLE_ALL,
                  "ablate": ort.GraphOptimizationLevel.ORT_ENABLE_ALL,
              }[mode]
              kwargs = {"disabled_optimizers": {"MatmulTransposeFusion"}} if mode == "ablate" else {}
              sess = ort.InferenceSession(m.SerializeToString(), so, providers=["CPUExecutionProvider"], **kwargs)
              y = sess.run(None, feeds)[0]
          print(y.shape, float(np.abs(y).sum()), flush=True)
          PY
      - name: Run each mode in its own process
        run: |
          python -c "import onnxruntime as o, onnx as x; print('onnxruntime', o.__version__, 'onnx', x.__version__)"
          set +e
          for mode in reference disable basic ablate extended all; do
            python repro.py $mode > out_$mode.txt 2>&1
            rc=$?
            echo "$mode exit=$rc $(tr '\n' ' ' < out_$mode.txt | cut -c1-100)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit 0

  build-test:
    name: ${{ matrix.variant }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, baseline]
        target: [onnxruntime_provider_test, onnxruntime_test_all]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 3
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revert only matmul_helper.h to the base commit (baseline)
        if: matrix.variant == 'baseline'
        run: |
          git log --oneline -3
          test "$(git rev-parse HEAD~2)" = "$BASE_SHA"
          git checkout HEAD~2 -- onnxruntime/core/providers/cpu/math/matmul_helper.h
          git diff --cached --stat
      - name: Build ${{ matrix.target }} (CPU, Release)
        run: >
          python tools/ci_build/build.py --config Release --build_dir build --parallel --skip_tests
          --skip_submodule_sync --compile_no_warning_as_error
          --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=ON
          --target ${{ matrix.target }}
      - name: New tests (fixed must pass, baseline must fail)
        working-directory: build/Release
        run: |
          if [ "${{ matrix.target }}" = onnxruntime_provider_test ]; then
            NEW_TESTS="FusedMatMulOpTest.DoubleTypeTransposeBatchAEmptyM FusedMatMulOpTest.DoubleTypeTransposeBatchAEmptyK FusedMatMulOpTest.DoubleTypeTransposeBatchBEmptyN FusedMatMulOpTest.DoubleTypeTransposeBatchBEmptyK FusedMatMulOpTest.DoubleTypeTransposeBatchABEmptyK"
          else
            NEW_TESTS="GraphTransformationTests.TransposeMatmulFusionWithZeroSizedBatchTranspose"
          fi
          set +e
          bad=0
          for t in $NEW_TESTS; do
            # a gtest filter that matches nothing exits 0, so require the test to be listed first
            ./${{ matrix.target }} --gtest_list_tests --gtest_filter="$t" | grep -q "${t#*.}" || { echo "MISSING $t"; bad=1; continue; }
            ./${{ matrix.target }} --gtest_filter="$t" > "log_$t.txt" 2>&1
            rc=$?
            tail -n 4 "log_$t.txt"
            echo "$t exit=$rc (136 = SIGFPE)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "${{ matrix.variant }}" = fixed ] && [ $rc -ne 0 ]; then bad=1; fi
            if [ "${{ matrix.variant }}" = baseline ] && [ $rc -eq 0 ]; then echo "UNEXPECTED PASS on baseline: $t"; bad=1; fi
          done
          exit $bad
      - name: Related existing tests (regression check)
        if: matrix.variant == 'fixed' && always()
        working-directory: build/Release
        run: |
          if [ "${{ matrix.target }}" = onnxruntime_provider_test ]; then FILTER='*FusedMatMul*:*MatMul*'; else FILTER='*TransposeMatmul*:*MatmulTransposeFusion*'; fi
          ./${{ matrix.target }} --gtest_filter="$FILTER" 2>&1 | tail -n 25
          exit ${PIPESTATUS[0]}
